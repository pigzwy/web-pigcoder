<header class="w-full header-surface transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav class="h-20 grid grid-cols-[1fr_auto_1fr] items-center gap-6" aria-label="Primary navigation">
      <!-- 左：桌面菜单 / 移动端汉堡 -->
      <div class="flex items-center gap-1 justify-self-start">
        <button id="mobile-nav-toggle" type="button" class="inline-flex md:hidden items-center justify-center min-h-10 min-w-10 rounded-lg text-custom-ink dark:text-white hover:bg-custom-ink/[0.04] dark:hover:bg-white/10 transition-colors" aria-expanded="false" aria-controls="mobile-nav-panel" aria-label="打开导航菜单" title="打开导航菜单">
          <span id="mobile-nav-toggle-icon" class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <div class="hidden md:flex items-center gap-2">
          <a data-nav-key="index" data-i18n="common.nav.index" href="index.html">首页</a>
          <a data-nav-key="docs" data-i18n="common.nav.docs" href="docs.html">文档</a>
          <a data-nav-key="pricing" data-i18n="common.nav.pricing" href="pricing.html">价格</a>
          <a data-nav-key="models" data-i18n="common.nav.models" href="models.html">模型</a>
        </div>
      </div>
      <!-- 中：logo + 名字 -->
      <a href="index.html" class="justify-self-center flex min-w-0 items-center gap-2 rounded-lg focus-visible:outline-offset-4" aria-label="Pigcode 首页">
        <img src="logo.png?v=20260815-paper-ink-gold" alt="Pigcode" class="w-8 h-8 rounded-full object-cover flex-shrink-0" width="32" height="32" />
        <span class="truncate text-custom-ink dark:text-white font-semibold tracking-[-0.01em]">Pigcode</span>
      </a>
      <!-- 右：语言 / 主题 / 控制台 -->
      <div class="flex flex-shrink-0 items-center gap-2 sm:gap-3 justify-self-end">
        <button id="language-toggle" type="button" class="hidden sm:inline-flex min-h-10 items-center gap-1.5 rounded-lg px-2.5 text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] hover:text-custom-ink dark:hover:bg-white/10 dark:hover:text-white transition-colors" aria-label="切换到英文" title="切换到英文">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">language</span>
          <span id="language-toggle-label" class="hidden sm:inline text-xs font-semibold tracking-[0.14em]">EN</span>
        </button>
        <button id="theme-toggle" type="button" class="hidden sm:inline-flex min-h-10 min-w-10 items-center justify-center rounded-lg text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] hover:text-custom-ink dark:hover:bg-white/10 dark:hover:text-white transition-colors" aria-label="切换主题" title="切换主题">
          <span id="theme-toggle-icon" class="material-symbols-outlined text-[20px]" aria-hidden="true">dark_mode</span>
        </button>
        <!-- 外层容器控制显隐：.btn-ghost 的 display 会盖过 Tailwind 的 .hidden -->
        <div class="hidden lg:block">
          <a href="https://chat.pigcode.ai/" target="_top" data-i18n="common.header.studio" class="btn-ghost min-h-10 rounded-full px-4 sm:px-5 text-sm border border-custom-line dark:border-white/10 hover:border-custom-gold/50 hover:text-custom-ink dark:hover:text-white">Studio</a>
        </div>
        <a href="https://pigcode.ai/login" target="_top" data-i18n="common.header.console" class="btn-primary inline-flex min-h-10 rounded-full px-4 sm:px-5 text-sm">控制台</a>
      </div>
    </nav>
    <div id="mobile-nav-panel" class="hidden md:hidden pb-4">
      <div class="rounded-2xl border border-custom-line dark:border-white/10 panel-surface shadow-lg p-2">
        <div class="grid gap-1">
          <a
            data-nav-key="index"
            data-nav-active-class="block rounded-xl px-4 py-3 text-sm font-semibold bg-custom-ink text-white"
            data-nav-inactive-class="block rounded-xl px-4 py-3 text-sm font-medium text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] dark:hover:bg-white/10 transition-colors"
            data-i18n="common.nav.index"
            href="index.html">首页</a>
          <a
            data-nav-key="docs"
            data-nav-active-class="block rounded-xl px-4 py-3 text-sm font-semibold bg-custom-ink text-white"
            data-nav-inactive-class="block rounded-xl px-4 py-3 text-sm font-medium text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] dark:hover:bg-white/10 transition-colors"
            data-i18n="common.nav.docs"
            href="docs.html">文档</a>
          <a
            data-nav-key="pricing"
            data-nav-active-class="block rounded-xl px-4 py-3 text-sm font-semibold bg-custom-ink text-white"
            data-nav-inactive-class="block rounded-xl px-4 py-3 text-sm font-medium text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] dark:hover:bg-white/10 transition-colors"
            data-i18n="common.nav.pricing"
            href="pricing.html">价格</a>
          <a
            data-nav-key="models"
            data-nav-active-class="block rounded-xl px-4 py-3 text-sm font-semibold bg-custom-ink text-white"
            data-nav-inactive-class="block rounded-xl px-4 py-3 text-sm font-medium text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] dark:hover:bg-white/10 transition-colors"
            data-i18n="common.nav.models"
            href="models.html">模型</a>
          <!-- 外链：不加 data-nav-key，否则 markActiveNav 会覆写 className -->
          <a
            data-i18n="common.header.studio"
            href="https://chat.pigcode.ai/"
            target="_top"
            class="block rounded-xl px-4 py-3 text-sm font-medium text-custom-muted dark:text-slate-300 hover:bg-custom-ink/[0.04] dark:hover:bg-white/10 transition-colors">Studio</a>
        </div>
        <div class="mt-2 grid grid-cols-2 gap-2 sm:hidden">
          <button type="button" data-i18n="common.header.language" class="min-h-10 rounded-xl border border-custom-line px-4 text-sm font-semibold text-custom-muted dark:border-white/10 dark:text-slate-300" onclick="document.getElementById('language-toggle') && document.getElementById('language-toggle').click()">语言</button>
          <button type="button" data-i18n="common.header.theme" class="min-h-10 rounded-xl border border-custom-line px-4 text-sm font-semibold text-custom-muted dark:border-white/10 dark:text-slate-300" onclick="document.getElementById('theme-toggle') && document.getElementById('theme-toggle').click()">主题</button>
        </div>
      </div>
    </div>
  </div>
</header>
