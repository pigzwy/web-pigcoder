  <main id="main-content">
    <section class="hero-modern relative overflow-hidden">
      <div class="surface-gradient-hero"></div>
      <div class="section-shell-wide py-24 md:py-32">
        <div class="hero-constellation" aria-hidden="true">
          <svg class="constellation-orbits" viewBox="0 0 560 560" fill="none">
            <circle cx="280" cy="280" r="118" />
            <circle cx="280" cy="280" r="208" />
          </svg>
          <span class="constellation-center"><img src="logo.png" alt="" loading="lazy" /></span>
          <span class="constellation-dot" style="left:68.8%;top:43.2%;--d:0.55"><span class="constellation-tile"><img src="model-icons/openai.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:43.2%;top:31.2%;--d:0.55"><span class="constellation-tile"><img src="model-icons/anthropic.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:31.2%;top:56.8%;--d:0.55"><span class="constellation-tile"><img src="model-icons/google.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:56.8%;top:68.8%;--d:0.55"><span class="constellation-tile"><img src="model-icons/deepseek.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:86%;top:50%;--d:1"><span class="constellation-tile"><img src="model-icons/meta.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:75.5%;top:24.5%;--d:1"><span class="constellation-tile"><img src="model-icons/mistral.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:46.9%;top:14.1%;--d:1"><span class="constellation-tile"><img src="model-icons/alibaba.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:22.4%;top:26.9%;--d:1"><span class="constellation-tile"><img src="model-icons/bytedance.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:14%;top:50%;--d:1"><span class="constellation-tile"><img src="model-icons/moonshotai.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:24.5%;top:75.5%;--d:1"><span class="constellation-tile"><img src="model-icons/nvidia.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:50%;top:86%;--d:1"><span class="constellation-tile"><img src="model-icons/microsoft.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:75.5%;top:75.5%;--d:1"><span class="constellation-tile"><img src="model-icons/xai.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:89%;top:29%;--d:1.5"><span class="constellation-tile is-sm"><img src="model-icons/zhipuai.svg" alt="" loading="lazy" /></span></span>
          <span class="constellation-dot" style="left:11%;top:66%;--d:1.5"><span class="constellation-tile is-sm"><img src="model-icons/minimax.svg" alt="" loading="lazy" /></span></span>
        </div>
        <div class="max-w-3xl text-left">
          <span class="kicker mb-5 hero-rise">
            <span class="material-symbols-outlined text-sm text-custom-gold" aria-hidden="true">hub</span>
            <span data-i18n="models.hero.badge">模型目录</span>
          </span>
          <h1 data-i18n-html="models.hero.title"
            class="hero-rise hero-rise-2 text-4xl sm:text-5xl md:text-6xl font-medium font-headline tracking-[-0.03em] text-custom-ink dark:text-white mb-6 leading-[1.08] text-balance">
            <span>全球模型元数据</span>
            <span class="brand-emphasis">一览无余</span>
          </h1>
          <p data-i18n="models.hero.description"
            class="hero-rise hero-rise-3 text-custom-muted dark:text-slate-300 text-base md:text-lg max-w-2xl leading-relaxed">
            汇聚 60+ 厂商 5,000+ 模型的上下文、能力标签与模态支持，并标注数据更新时间，支持一站检索对比。</p>
          <dl class="hero-rise hero-rise-4 mt-10 grid max-w-xl grid-cols-3 gap-6">
            <div class="stat-item">
              <dd><strong id="stat-models">5,097</strong></dd>
              <dt><span data-i18n="models.hero.stats.models">收录模型</span></dt>
            </div>
            <div class="stat-item">
              <dd><strong id="stat-vendors">60</strong></dd>
              <dt><span data-i18n="models.hero.stats.vendors">模型厂商</span></dt>
            </div>
            <div class="stat-item">
              <dd><strong id="stat-types">18</strong></dd>
              <dt><span data-i18n="models.hero.stats.types">模型类型</span></dt>
            </div>
          </dl>
        </div>
      </div>
    </section>

    <section class="relative overflow-hidden section-block-tight">
      <div class="surface-gradient-main"></div>
      <div class="section-shell-wide">
        <div class="grid gap-8 lg:grid-cols-[260px_minmax(0,1fr)] lg:items-start">

          <aside>
            <details id="model-filters" class="model-filter-panel rounded-2xl">
              <summary class="model-filter-summary lg:hidden">
                <span data-i18n="models.filters.title">筛选</span>
                <span class="material-symbols-outlined text-lg ml-auto" aria-hidden="true">expand_more</span>
              </summary>
              <div class="model-filter-body">
                <label class="block">
                  <span class="sr-only" data-i18n="models.filters.search">搜索模型</span>
                  <input id="model-search" type="search" data-i18n-attr="placeholder:models.filters.searchPlaceholder"
                    placeholder="搜索模型名或 ID…"
                    class="w-full rounded-lg border-custom-line dark:border-white/15 bg-white/70 dark:bg-white/5 text-sm text-custom-ink dark:text-white placeholder:text-custom-muted dark:placeholder:text-slate-500 focus:border-custom-gold focus:ring-custom-gold/40" />
                </label>
                <div>
                  <p class="model-filter-heading" data-i18n="models.filters.type">类型</p>
                  <div id="filter-types" class="grid gap-1.5"></div>
                </div>
                <div>
                  <p class="model-filter-heading" data-i18n="models.filters.vendor">厂商</p>
                  <input id="vendor-search" type="search" data-i18n-attr="placeholder:models.filters.vendorSearchPlaceholder"
                    placeholder="搜索厂商…"
                    class="mb-2 w-full rounded-lg border-custom-line dark:border-white/15 bg-white/70 dark:bg-white/5 text-xs text-custom-ink dark:text-white placeholder:text-custom-muted dark:placeholder:text-slate-500 focus:border-custom-gold focus:ring-custom-gold/40" />
                  <div id="filter-vendors" class="model-filter-scroll grid gap-1"></div>
                </div>
                <div>
                  <p class="model-filter-heading" data-i18n="models.filters.capability">能力</p>
                  <div id="filter-caps" class="grid gap-1"></div>
                </div>
                <div>
                  <p class="model-filter-heading" data-i18n="models.filters.context">上下文</p>
                  <div id="filter-ctx" class="grid gap-1"></div>
                </div>
                <label class="model-filter-option">
                  <input id="filter-dep" type="checkbox" checked
                    class="rounded border-custom-line dark:border-white/20 text-custom-gold focus:ring-custom-gold/40" />
                  <span data-i18n="models.filters.hideDeprecated">隐藏已弃用模型</span>
                </label>
                <button type="button" id="filter-reset"
                  class="w-full rounded-lg border border-custom-line dark:border-white/15 px-3 py-2 text-sm font-semibold text-custom-muted dark:text-slate-300 hover:border-custom-gold/50 hover:text-custom-ink dark:hover:text-white transition-colors"
                  data-i18n="models.filters.reset">重置筛选</button>
              </div>
            </details>
          </aside>

          <div>
            <div id="modal-tabs" class="mb-4 flex flex-wrap gap-2"></div>
            <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
              <p id="model-count" class="text-sm font-medium text-custom-muted dark:text-slate-400 tabular-nums"></p>
              <label class="flex items-center gap-2 text-sm text-custom-muted dark:text-slate-400">
                <span data-i18n="models.toolbar.sort">排序</span>
                <select id="model-sort"
                  class="rounded-lg border-custom-line dark:border-white/15 bg-white/70 dark:bg-custom-surface-dark text-sm text-custom-ink dark:text-white focus:border-custom-gold focus:ring-custom-gold/40">
                  <option value="newest" data-i18n="models.toolbar.sortNewest">最新优先</option>
                  <option value="context" data-i18n="models.toolbar.sortContext">上下文从大到小</option>
                  <option value="name" data-i18n="models.toolbar.sortName">名称 A→Z</option>
                </select>
              </label>
            </div>
            <div id="model-card-grid" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
              <div class="pricing-card-skeleton partial-loading"></div>
              <div class="pricing-card-skeleton partial-loading"></div>
              <div class="pricing-card-skeleton partial-loading"></div>
              <div class="pricing-card-skeleton partial-loading"></div>
              <div class="pricing-card-skeleton partial-loading"></div>
              <div class="pricing-card-skeleton partial-loading"></div>
            </div>
            <div id="model-empty" class="hidden rounded-xl border border-dashed border-custom-line dark:border-white/15 px-6 py-16 text-center text-custom-muted dark:text-slate-400">
              <p data-i18n="models.empty">没有匹配的模型，试试放宽筛选条件。</p>
            </div>
            <div class="mt-8 text-center">
              <button type="button" id="model-more"
                class="btn-secondary hidden rounded-full px-8 py-2.5 text-sm font-semibold"
                data-i18n="models.loadMore">加载更多</button>
            </div>
            <div class="model-data-strip mt-10 text-sm text-custom-muted dark:text-slate-500">
              <span id="data-updated" class="tabular-nums"></span>
              <span aria-hidden="true">·</span>
              <a href="models-data.json" download
                class="font-mono text-[0.8rem] underline decoration-custom-gold/50 underline-offset-2 hover:text-custom-ink dark:hover:text-white transition-colors">models-data.json</a>
              <span aria-hidden="true">·</span>
              <span>
                <span data-i18n="models.note">* 本站实际可用模型与倍率以控制台实时配置为准，详见</span>
                <a href="pricing.html" class="font-medium text-custom-ink dark:text-custom-gold underline decoration-custom-gold/60 underline-offset-2"
                  data-i18n="models.noteLink">价格页</a>
              </span>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>
